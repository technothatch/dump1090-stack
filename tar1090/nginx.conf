# tar1090 + /data for dump1090-stack.
#
# /       -> tar1090 single-page UI (fetched at image build time)
# /data/  -> decoder JSON written by readsb --write-json (bind-mounted)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # aircraft.json, receiver.json, stats.json, history_NNN.json - the UI
    # polls these every second, so never cache them.
    location /data/ {
        alias /data/;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        charset utf-8;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # The UI is a single origin; keep the usual sniffing protections.
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;
}
