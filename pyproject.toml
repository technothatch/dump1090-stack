[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dump1090-stack"
version = "0.1.0"
description = "Validation tooling for a production Docker Compose stack around the dump1090/readsb ADS-B ecosystem (tar1090, Prometheus, Grafana, Alertmanager)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "technothatch" }]
keywords = [
    "ads-b",
    "dump1090",
    "readsb",
    "mode-s",
    "aircraft",
    "docker-compose",
    "prometheus",
    "grafana",
    "tar1090",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Ham Radio",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.11",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0.12",
]

[project.urls]
Homepage = "https://github.com/technothatch/dump1090-stack"
Repository = "https://github.com/technothatch/dump1090-stack"
Issues = "https://github.com/technothatch/dump1090-stack/issues"
Changelog = "https://github.com/technothatch/dump1090-stack/blob/main/CHANGELOG.md"

[project.scripts]
dump1090-stack-validate = "dump1090_stack.validate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N818"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
warn_unreachable = true
disallow_any_generics = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["dump1090_stack"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
